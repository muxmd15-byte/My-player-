<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAGHAM 🎧 - Modern Cloud & YouTube Player</title>
  <style>
    :root {
      --bg-main: #0b0b0f;
      --bg-card: #13131a;
      --bg-hover: #1e1e28;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f4f4f5;
      --text-muted: #94a3b8;
      --border: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.5px; }
    
    .header-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .action-btn:hover { border-color: var(--accent); background: #272733; }

    .yt-input-box {
      display: flex;
      gap: 8px;
      background: var(--bg-main);
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .yt-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 0.85rem;
      outline: none;
    }
    .yt-input-box input::placeholder { color: var(--text-muted); }
    .yt-input-box button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .yt-input-box button:hover { background: var(--accent-hover); }

    .media-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      border: 1px solid var(--border);
    }

    video {
      width: 100%;
      max-height: 280px;
      display: none;
      object-fit: contain;
    }
    video.show { display: block; }

    .youtube-frame-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      background: #000;
    }
    .youtube-frame-container.show { display: block; }
    .youtube-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 50px;
    }
    .bar {
      width: 6px;
      height: 15px;
      background: var(--accent);
      border-radius: 4px;
      transition: height 0.2s ease;
    }
    .playing .bar { animation: bounce 0.8s infinite alternate; }
    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { height: 10px; }
      100% { height: 48px; }
    }

    .track-info { text-align: center; padding: 0 10px; }
    .track-title { 
      font-size: 1.1rem; 
      font-weight: 600; 
      margin-bottom: 4px; 
      word-break: break-word; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .track-status { font-size: 0.8rem; color: var(--text-muted); }

    .progress-area { display: flex; flex-direction: column; gap: 6px; }
    
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      background: var(--border);
      border-radius: 4px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      font-size: 1.1rem;
    }
    .btn:hover { background: var(--bg-hover); }
    
    .play-btn {
      background: var(--accent);
      width: 54px;
      height: 54px;
      font-size: 1.3rem;
      box-shadow: 0 0 25px var(--accent-glow);
    }
    .play-btn:hover { background: var(--accent-hover); transform: scale(1.05); }

    .mode-btn {
      font-size: 0.78rem;
      border-radius: 12px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--bg-hover);
      color: var(--text-muted);
      font-weight: 500;
    }
    .mode-btn.active {
      border-color: var(--accent);
      color: var(--text-main);
      background: rgba(99, 102, 241, 0.1);
    }

    .playlist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      padding-right: 4px;
    }

    .playlist::-webkit-scrollbar { width: 5px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg-main);
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      gap: 10px;
    }
    .track-item:hover { background: var(--bg-hover); border-color: var(--border); }
    .track-item.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.12);
    }
    .track-name { font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🎧 NAGHAM</h1>
    <div class="header-actions">
      <button class="action-btn" id="toggleVideoBtn">🎬 Video</button>
    </div>
  </header>

  <!-- YouTube Input Form -->
  <div class="yt-input-box">
    <input type="text" id="ytUrlInput" placeholder="🔗 Paste YouTube URL here..." />
    <button id="addYtBtn">Add ➕</button>
  </div>

  <div class="media-box" id="mediaBox">
    <video id="player" playsinline></video>
    <div class="youtube-frame-container" id="ytFrameContainer">
      <div id="ytPlayer"></div>
    </div>
    <div class="visualizer" id="visualizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div class="track-info">
    <div class="track-title" id="trackTitle">✨ Loading playlist...</div>
    <div class="track-status" id="modeLabel">Mode: Sequential Play</div>
  </div>

  <div class="progress-area" id="progressArea">
    <input type="range" id="progressBar" value="0" min="0" step="0.1" />
    <div class="time-labels">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn mode-btn active" id="modeBtn" title="Change Play Mode">➡️ Sequential</button>
    <button class="btn" id="prevBtn" title="Previous Track">⏮️</button>
    <button class="btn play-btn" id="playPauseBtn" title="Play / Pause">▶️</button>
    <button class="btn" id="nextBtn" title="Next Track">⏭️</button>
  </div>

  <div class="playlist" id="playlist"></div>
</div>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const player = document.getElementById('player');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const modeBtn = document.getElementById('modeBtn');
  const modeLabel = document.getElementById('modeLabel');
  const progressBar = document.getElementById('progressBar');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const trackTitle = document.getElementById('trackTitle');
  const playlistEl = document.getElementById('playlist');
  const visualizer = document.getElementById('visualizer');
  const toggleVideoBtn = document.getElementById('toggleVideoBtn');
  const ytUrlInput = document.getElementById('ytUrlInput');
  const addYtBtn = document.getElementById('addYtBtn');
  const ytFrameContainer = document.getElementById('ytFrameContainer');
  const progressArea = document.getElementById('progressArea');

  let tracks = [];
  let currentIndex = 0;
  let playMode = 0; 
  let showVideo = false;
  let ytPlayer = null;
  let isYoutubeCurrent = false;
  let ytApiReady = false;
  let pendingYtIndex = null;

  const modes = [
    { btn: "➡️ Sequential", label: "Mode: Sequential Play (Stops at end)" },
    { btn: "🔁 Loop List", label: "Mode: Repeat Full Playlist" },
    { btn: "🔂 Repeat Track", label: "Mode: Loop Current Track" }
  ];

  window.onYouTubeIframeAPIReady = function() {
    ytApiReady = true;
    if (pendingYtIndex !== null) {
      loadTrack(pendingYtIndex, true);
      pendingYtIndex = null;
    }
  };

  async function loadTracksFromRoot() {
    try {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      
      if (!host.includes('github.io') || pathParts.length === 0) {
        trackTitle.textContent = "🚀 Open via GitHub Pages to load tracks";
        return;
      }

      const username = host.split('.')[0];
      const repo = pathParts[0];
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents`;

      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error("Failed to fetch repository contents");

      const files = await response.json();
      const allowedExt = ['.mp4', '.mp3', '.mkv', '.webm', '.m4a', '.wav', '.ogg'];

      let repoTracks = files
        .filter(item => item.type === 'file' && allowedExt.some(ext => item.name.toLowerCase().endsWith(ext)))
        .map(item => {
          const cleanName = item.name.replace(/\.[^/.]+$/, "");
          return {
            title: cleanName,
            file: item.download_url,
            type: 'local'
          };
        });

      let savedYts = [];
      try {
        const local = localStorage.getItem('nagham_yt_tracks');
        if (local) savedYts = JSON.parse(local);
      } catch(e) {}

      tracks = [...repoTracks, ...savedYts];

      if (tracks.length === 0) {
        trackTitle.textContent = "📂 Drop media files or paste YouTube link above!";
        return;
      }

      loadTrack(0, false);
    } catch (err) {
      trackTitle.textContent = "⚠️ Error loading repository files";
      console.error(err);
    }
  }

  function extractYouTubeId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  addYtBtn.onclick = () => {
    const url = ytUrlInput.value.trim();
    const videoId = extractYouTubeId(url);
    if (!videoId) {
      alert("❌ Invalid YouTube URL! Please check the link.");
      return;
    }

    const newTrack = {
      title: "YouTube Video (" + videoId + ")",
      file: videoId,
      type: 'youtube'
    };

    tracks.push(newTrack);
    saveYtTracks();
    ytUrlInput.value = '';
    renderPlaylist();
    
    if (tracks.length === 1) {
      loadTrack(0, true);
    }
  };

  function saveYtTracks() {
    const yts = tracks.filter(t => t.type === 'youtube');
    try {
      localStorage.setItem('nagham_yt_tracks', JSON.stringify(yts));
    } catch(e) {}
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    tracks.forEach((track, index) => {
      const div = document.createElement('div');
      div.className = `track-item ${index === currentIndex ? 'active' : ''}`;
      const icon = track.type === 'youtube' ? '📺' : '🎵';
      div.innerHTML = `<span class="track-name">${icon} ${index + 1}. ${track.title}</span><span>${index === currentIndex ? '🔊' : '▶️'}</span>`;
      div.onclick = () => loadTrack(index, true);
      playlistEl.appendChild(div);
    });
  }

  function loadTrack(index, autoPlay = false) {
    if (!tracks.length) return;
    currentIndex = index;
    const track = tracks[currentIndex];
    trackTitle.textContent = track.title;
    renderPlaylist();

    player.pause();
    player.style.display = 'none';
    if (ytPlayer && ytPlayer.stopVideo) {
      try { ytPlayer.stopVideo(); } catch(e){}
    }
    ytFrameContainer.classList.remove('show');

    if (track.type === 'youtube') {
      isYoutubeCurrent = true;
      visualizer.style.display = 'none';
      progressArea.style.display = 'none';

      if (!ytApiReady) {
        pendingYtIndex = index;
        trackTitle.textContent = "⏳ Loading YouTube API...";
        return;
      }

      ytFrameContainer.classList.add('show');
      if (!ytPlayer) {
        ytPlayer = new YT.Player('ytPlayer', {
          height: '100%',
          width: '100%',
          videoId: track.file,
          playerVars: { 'autoplay': autoPlay ? 1 : 0, 'controls': 1 },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      } else {
        ytPlayer.loadVideoById(track.file);
        if (!autoPlay) ytPlayer.stopVideo();
      }
      playPauseBtn.textContent = autoPlay ? '⏸️' : '▶️';
    } else {
      isYoutubeCurrent = false;
      visualizer.style.display = showVideo ? 'none' : 'flex';
      progressArea.style.display = 'flex';
      player.style.display = showVideo ? 'block' : 'none';
      player.src = track.file;
      if (autoPlay) {
        player.play();
      }
    }
  }

  function onPlayerStateChange(event) {
    if (event.data == YT.PlayerState.PLAYING) {
      playPauseBtn.textContent = '⏸️';
    } else if (event.data == YT.PlayerState.PAUSED) {
      playPauseBtn.textContent = '▶️';
    } else if (event.data == YT.PlayerState.ENDED) {
      handleTrackEnd();
    }
  }

  function togglePlay() {
    if (!tracks.length) return;
    if (isYoutubeCurrent) {
      if (ytPlayer) {
        const state = ytPlayer.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          ytPlayer.pauseVideo();
          playPauseBtn.textContent = '▶️';
        } else {
          ytPlayer.playVideo();
          playPauseBtn.textContent = '⏸️';
        }
      }
    } else {
      if (player.paused) {
        player.play();
      } else {
        player.pause();
      }
    }
  }

  player.onplay = () => {
    playPauseBtn.textContent = '⏸️';
    visualizer.classList.add('playing');
  };

  player.onpause = () => {
    playPauseBtn.textContent = '▶️';
    visualizer.classList.remove('playing');
  };

  player.ontimeupdate = () => {
    if (!isYoutubeCurrent && player.duration) {
      progressBar.max = player.duration;
      progressBar.value = player.currentTime;
      currentTimeEl.textContent = formatTime(player.currentTime);
      durationEl.textContent = formatTime(player.duration);
    }
  };

  progressBar.oninput = () => {
    if (!isYoutubeCurrent) {
      player.currentTime = progressBar.value;
    }
  };

  function handleTrackEnd() {
    if (playMode === 2) {
      if (isYoutubeCurrent) {
        ytPlayer.seekTo(0);
        ytPlayer.playVideo();
      } else {
        player.currentTime = 0;
        player.play();
      }
    } else if (currentIndex < tracks.length - 1) {
      loadTrack(currentIndex + 1, true);
    } else if (playMode === 1) {
      loadTrack(0, true);
    } else {
      playPauseBtn.textContent = '▶️';
      visualizer.classList.remove('playing');
    }
  }

  player.onended = handleTrackEnd;

  nextBtn.onclick = () => {
    if (!tracks.length) return;
    let next = (currentIndex + 1) % tracks.length;
    loadTrack(next, true);
  };

  prevBtn.onclick = () => {
    if (!tracks.length) return;
    let prev = (currentIndex - 1 + tracks.length) % tracks.length;
    loadTrack(prev, true);
  };

  modeBtn.onclick = () => {
    playMode = (playMode + 1) % 3;
    modeBtn.textContent = modes[playMode].btn;
    modeLabel.textContent = modes[playMode].label;
  };

  toggleVideoBtn.onclick = () => {
    showVideo = !showVideo;
    if (isYoutubeCurrent) return;
    if (showVideo) {
      player.classList.add('show');
      visualizer.style.display = 'none';
      toggleVideoBtn.textContent = '🎧 Audio Only';
    } else {
      player.classList.remove('show');
      visualizer.style.display = 'flex';
      toggleVideoBtn.textContent = '🎬 Video';
    }
  };

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  playPauseBtn.onclick = togglePlay;
  loadTracksFromRoot();
</script>

</body>
</html>
