<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAGHAM 🎧 - Modern Cloud Player</title>
  <style>
    :root {
      --bg-main: #0b0b0f;
      --bg-card: #13131a;
      --bg-hover: #1e1e28;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f4f4f5;
      --text-muted: #94a3b8;
      --border: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }

    h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.5px; }
    
    .toggle-video-btn {
      background: var(--bg-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .toggle-video-btn:hover { border-color: var(--accent); background: #272733; }

    .media-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      border: 1px solid var(--border);
    }

    video {
      width: 100%;
      max-height: 280px;
      display: none;
      object-fit: contain;
    }
    video.show { display: block; }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 50px;
    }
    .bar {
      width: 6px;
      height: 15px;
      background: var(--accent);
      border-radius: 4px;
      transition: height 0.2s ease;
    }
    .playing .bar { animation: bounce 0.8s infinite alternate; }
    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    .playing .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { height: 10px; }
      100% { height: 48px; }
    }

    .track-info { text-align: center; padding: 0 10px; }
    .track-title { 
      font-size: 1.1rem; 
      font-weight: 600; 
      margin-bottom: 6px; 
      word-break: break-word; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .track-status { font-size: 0.8rem; color: var(--text-muted); }

    .progress-area { display: flex; flex-direction: column; gap: 8px; }
    
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      background: var(--border);
      border-radius: 4px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      font-size: 1.1rem;
    }
    .btn:hover { background: var(--bg-hover); }
    
    .play-btn {
      background: var(--accent);
      width: 56px;
      height: 56px;
      font-size: 1.3rem;
      box-shadow: 0 0 25px var(--accent-glow);
    }
    .play-btn:hover { background: var(--accent-hover); transform: scale(1.05); }

    .mode-btn {
      font-size: 0.78rem;
      border-radius: 12px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--bg-hover);
      color: var(--text-muted);
      font-weight: 500;
    }
    .mode-btn.active {
      border-color: var(--accent);
      color: var(--text-main);
      background: rgba(99, 102, 241, 0.1);
    }

    .playlist {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      padding-top: 15px;
      padding-right: 4px;
    }

    .playlist::-webkit-scrollbar { width: 5px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .track-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--bg-main);
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      gap: 10px;
    }
    .track-item:hover { background: var(--bg-hover); border-color: var(--border); }
    .track-item.active {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.12);
    }
    .track-name { font-size: 0.9rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>🎧 NAGHAM</h1>
    <button class="toggle-video-btn" id="toggleVideoBtn">🎬 Toggle Video</button>
  </header>

  <div class="media-box" id="mediaBox">
    <video id="player" playsinline></video>
    <div class="visualizer" id="visualizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div class="track-info">
    <div class="track-title" id="trackTitle">✨ Loading playlist...</div>
    <div class="track-status" id="modeLabel">Mode: Sequential Play</div>
  </div>

  <div class="progress-area">
    <input type="range" id="progressBar" value="0" min="0" step="0.1" />
    <div class="time-labels">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn mode-btn active" id="modeBtn" title="Change Play Mode">➡️ Sequential</button>
    <button class="btn" id="prevBtn" title="Previous Track">⏮️</button>
    <button class="btn play-btn" id="playPauseBtn" title="Play / Pause">▶️</button>
    <button class="btn" id="nextBtn" title="Next Track">⏭️</button>
  </div>

  <div class="playlist" id="playlist"></div>
</div>

<script>
  const player = document.getElementById('player');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const modeBtn = document.getElementById('modeBtn');
  const modeLabel = document.getElementById('modeLabel');
  const progressBar = document.getElementById('progressBar');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const trackTitle = document.getElementById('trackTitle');
  const playlistEl = document.getElementById('playlist');
  const visualizer = document.getElementById('visualizer');
  const toggleVideoBtn = document.getElementById('toggleVideoBtn');

  let tracks = [];
  let currentIndex = 0;
  let playMode = 0; 
  let showVideo = false;

  const modes = [
    { btn: "➡️ Sequential", label: "Mode: Sequential Play (Stops at end)" },
    { btn: "🔁 Loop List", label: "Mode: Repeat Full Playlist" },
    { btn: "🔂 Repeat Track", label: "Mode: Loop Current Track" }
  ];

  async function loadTracksFromRoot() {
    try {
      const host = window.location.hostname;
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      
      if (!host.includes('github.io') || pathParts.length === 0) {
        trackTitle.textContent = "🚀 Open via GitHub Pages to load tracks automatically";
        return;
      }

      const username = host.split('.')[0];
      const repo = pathParts[0];
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents`;

      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error("Failed to fetch repository contents");

      const files = await response.json();
      const allowedExt = ['.mp4', '.mp3', '.mkv', '.webm', '.m4a', '.wav', '.ogg'];

      tracks = files
        .filter(item => item.type === 'file' && allowedExt.some(ext => item.name.toLowerCase().endsWith(ext)))
        .map(item => {
          const cleanName = item.name.replace(/\.[^/.]+$/, "");
          return {
            title: cleanName,
            file: item.download_url
          };
        });

      if (tracks.length === 0) {
        trackTitle.textContent = "📂 Drop media files next to index.html!";
        return;
      }

      loadTrack(0, false);
    } catch (err) {
      trackTitle.textContent = "⚠️ Error loading media from repository";
      console.error(err);
    }
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    tracks.forEach((track, index) => {
      const div = document.createElement('div');
      div.className = `track-item ${index === currentIndex ? 'active' : ''}`;
      div.innerHTML = `<span class="track-name">🎵 ${index + 1}. ${track.title}</span><span>${index === currentIndex ? '🔊' : '▶️'}</span>`;
      div.onclick = () => loadTrack(index, true);
      playlistEl.appendChild(div);
    });
  }

  function loadTrack(index, autoPlay = false) {
    if (!tracks.length) return;
    currentIndex = index;
    player.src = tracks[currentIndex].file;
    trackTitle.textContent = tracks[currentIndex].title;
    renderPlaylist();
    if (autoPlay) {
      player.play();
    }
  }

  function togglePlay() {
    if (!tracks.length) return;
    if (player.paused) {
      player.play();
    } else {
      player.pause();
    }
  }

  player.onplay = () => {
    playPauseBtn.textContent = '⏸️';
    visualizer.classList.add('playing');
  };

  player.onpause = () => {
    playPauseBtn.textContent = '▶️';
    visualizer.classList.remove('playing');
  };

  player.ontimeupdate = () => {
    if (player.duration) {
      progressBar.max = player.duration;
      progressBar.value = player.currentTime;
      currentTimeEl.textContent = formatTime(player.currentTime);
      durationEl.textContent = formatTime(player.duration);
    }
  };

  progressBar.oninput = () => {
    player.currentTime = progressBar.value;
  };

  player.onended = () => {
    if (playMode === 2) {
      player.currentTime = 0;
      player.play();
    } else if (currentIndex < tracks.length - 1) {
      loadTrack(currentIndex + 1, true);
    } else if (playMode === 1) {
      loadTrack(0, true);
    } else {
      playPauseBtn.textContent = '▶️';
      visualizer.classList.remove('playing');
    }
  };

  nextBtn.onclick = () => {
    if (!tracks.length) return;
    let next = (currentIndex + 1) % tracks.length;
    loadTrack(next, true);
  };

  prevBtn.onclick = () => {
    if (!tracks.length) return;
    let prev = (currentIndex - 1 + tracks.length) % tracks.length;
    loadTrack(prev, true);
  };

  modeBtn.onclick = () => {
    playMode = (playMode + 1) % 3;
    modeBtn.textContent = modes[playMode].btn;
    modeLabel.textContent = modes[playMode].label;
  };

  toggleVideoBtn.onclick = () => {
    showVideo = !showVideo;
    if (showVideo) {
      player.classList.add('show');
      visualizer.style.display = 'none';
      toggleVideoBtn.textContent = '🎧 Audio Only';
    } else {
      player.classList.remove('show');
      visualizer.style.display = 'flex';
      toggleVideoBtn.textContent = '🎬 Toggle Video';
    }
  };

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  playPauseBtn.onclick = togglePlay;
  loadTracksFromRoot();
</script>

</body>
</html>
